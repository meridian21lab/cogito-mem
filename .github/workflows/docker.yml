name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cogito-mem:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (keyword search; the model is not downloaded in CI)
        run: |
          docker run -d --name cm -p 127.0.0.1:7327:7327 -e COGITO_MEM_NO_DOWNLOAD=1 cogito-mem:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:7327/v1/status >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:7327/v1/memory -H 'Content-Type: application/json' \
            -d '{"op":"append","items":[{"author":"ci","text":"The container answers queries."}]}'
          curl -fs http://127.0.0.1:7327/v1/memory -H 'Content-Type: application/json' \
            -d '{"op":"query","text":"container answers"}' | grep -q "The container answers queries."
          curl -fsi http://127.0.0.1:7327/mcp -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | grep -qi "mcp-session-id"
          docker exec cm /opt/llama/llama-server --version
          docker logs cm
      - name: Publish to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
