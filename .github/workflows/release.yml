name: release

# Tag a version (git tag v0.2.0 && git push origin v0.2.0) to publish it to PyPI, the MCP Registry and GitHub.
# PyPI publishing uses trusted publishing: add this repository and this workflow as a
# trusted publisher of the `cogito-mem` project on pypi.org once, before the first tag.
# The MCP Registry entry (server.json, io.github.meridian21lab/cogito-mem) is proved by GitHub OIDC and by the
# `mcp-name:` line in the README, which becomes the PyPI description.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches every version (package, plugin, MCP Registry entry)
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          versions = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "plugin.json": json.load(open(".claude-plugin/plugin.json"))["version"],
              "server.json": json.load(open("server.json"))["version"],
              "server.json package": json.load(open("server.json"))["packages"][0]["version"],
          }
          wrong = {k: v for k, v in versions.items() if f"v{v}" != tag}
          assert not wrong, f"tag {tag} does not match {wrong}"
          PY
      - name: Point the README's bundled images at this tag on GitHub, for the PyPI page
        # the plugin directory shows only images bundled in the plugin; PyPI only images on the web
        run: sed -i "s#](site/assets/#](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/site/assets/#g" README.md
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # the registry checks the new PyPI release, which can take a minute to appear
          for attempt in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 30; done
          exit 1
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
