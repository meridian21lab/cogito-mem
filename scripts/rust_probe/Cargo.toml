[package]
name = "cogi-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
half = "2.7.1"
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
ureq = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
